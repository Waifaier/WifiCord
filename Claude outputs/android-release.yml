name: Build e publicar APK Android

# Roda quando algo muda dentro de mobile/ (a casca Android) ou quando você
# dispara manualmente pela aba "Actions" do GitHub. Mudanças só no site
# (client/, server/) NÃO disparam isso — o app Android carrega o site ao
# vivo, então aquelas mudanças já aparecem sozinhas assim que o Render
# terminar o deploy, sem precisar de um APK novo.
on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write # precisa pra poder criar o Release com o APK anexado

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar o SDK do Android
        uses: android-actions/setup-android@v3

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências do Capacitor
        run: npm ci

      - name: Sincronizar projeto Android (cap sync)
        run: npx cap sync android

      - name: Calcular versão
        id: version
        run: |
          CODE="${{ github.run_number }}"
          NAME="1.0.${{ github.run_number }}"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Restaurar a keystore de assinatura
        working-directory: mobile/android
        env:
          WC_KEYSTORE_BASE64: ${{ secrets.WC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WC_KEYSTORE_BASE64" ]; then
            echo "::error::Falta configurar o secret WC_KEYSTORE_BASE64 (e os outros 3 — veja mobile/keystore/LEIA-ME.txt)."
            exit 1
          fi
          echo "$WC_KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Dar permissão de execução ao gradlew
        working-directory: mobile/android
        run: chmod +x ./gradlew

      - name: Montar e assinar o APK (assembleRelease)
        working-directory: mobile/android
        env:
          WC_VERSION_CODE: ${{ steps.version.outputs.code }}
          WC_VERSION_NAME: ${{ steps.version.outputs.name }}
          WC_KEYSTORE_PATH: release.jks
          WC_KEYSTORE_PASSWORD: ${{ secrets.WC_KEYSTORE_PASSWORD }}
          WC_KEY_ALIAS: ${{ secrets.WC_KEY_ALIAS }}
          WC_KEY_PASSWORD: ${{ secrets.WC_KEY_PASSWORD }}
          WC_GITHUB_OWNER: ${{ github.repository_owner }}
          WC_GITHUB_REPO: ${{ github.event.repository.name }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Apagar a keystore do runner
        if: always()
        working-directory: mobile/android
        run: rm -f release.jks

      - name: Renomear o APK final
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/wificord.apk

      - name: Publicar Release no GitHub (é aqui que o updater dentro do app vai olhar)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.code }}
          name: "WifiCord Android v${{ steps.version.outputs.name }}"
          body: |
            Build automático a partir do commit ${{ github.sha }}.

            Esse é o APK da casca Android do WifiCord — o conteúdo do app
            (chat, chamadas, etc.) sempre carrega direto do site
            (wificord.onrender.com), então só precisa reinstalar isso aqui
            quando essa própria "casca" nativa mudar (permissões, ícone,
            compartilhamento de tela, etc).
          files: mobile/dist/wificord.apk
          token: ${{ secrets.GITHUB_TOKEN }}
